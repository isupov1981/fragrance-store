services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fragrance
      POSTGRES_USER: fragrance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fragrance}
    volumes:
      - fragrance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragrance"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fragrance}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fragrancesecret}
    volumes:
      - fragrance_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fragrance:${POSTGRES_PASSWORD:-fragrance}@postgres:5432/fragrance?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-fragrance-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-fragrance}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-fragrancesecret}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/fragrance-media}
      S3_FORCE_PATH_STYLE: "true"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}

volumes:
  fragrance_postgres:
  fragrance_minio:
