services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fragrance
      POSTGRES_USER: fragrance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - fragrance_postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragrance"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    volumes:
      - fragrance_minio:/data
    networks:
      - internal
    # API/console stay on the internal network only — do not publish 9000/9001.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - internal
    environment:
      DATABASE_URL: postgresql://fragrance:${POSTGRES_PASSWORD}@postgres:5432/fragrance?schema=public
      DATABASE_URL_UNPOOLED: postgresql://fragrance:${POSTGRES_PASSWORD}@postgres:5432/fragrance?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}
      S3_FORCE_PATH_STYLE: "true"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GROW_USER_ID: ${GROW_USER_ID:-}
      GROW_PAGE_CODE: ${GROW_PAGE_CODE:-}
      GROW_WEBHOOK_SECRET: ${GROW_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      HERMES_AGENT_TOKEN: ${HERMES_AGENT_TOKEN:-}
      HEALTH_CHECK_TOKEN: ${HEALTH_CHECK_TOKEN:-}
      CSP_ENFORCE: ${CSP_ENFORCE:-}
      HSTS_PRELOAD: ${HSTS_PRELOAD:-}

  # Optional: run Nous Hermes Agent on the host (not vendored as an image).
  # See hermes/README.md for Telegram gateway + cron setup.

networks:
  internal:
    driver: bridge

volumes:
  fragrance_postgres:
  fragrance_minio:
