services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fragrance
      POSTGRES_USER: fragrance
      POSTGRES_PASSWORD: fragrance
    ports:
      - "5432:5432"
    volumes:
      - fragrance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragrance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fragrance_postgres:
