services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fragrance
      POSTGRES_USER: fragrance
      POSTGRES_PASSWORD: fragrance
    ports:
      - "5432:5432"
    volumes:
      - fragrance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fragrance"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fragrance
      MINIO_ROOT_PASSWORD: fragrancesecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - fragrance_minio:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 4
        mc alias set local http://minio:9000 fragrance fragrancesecret
        mc mb -p local/fragrance-media || true
        mc anonymous set download local/fragrance-media || true

volumes:
  fragrance_postgres:
  fragrance_minio:
